<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>LOONOOL · Demo 主页</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
        "Microsoft YaHei", system-ui, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .container {
      max-width: 800px;
      margin: 60px auto;
      padding: 0 20px;
      text-align: center;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    p.desc {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 36px;
    }

    .button {
      display: inline-block;
      padding: 14px 26px;
      background: #2563eb;
      color: #fff;
      border-radius: 10px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .button:hover {
      background: #1d4ed8;
    }

    .card {
      margin-top: 40px;
      border: 1px solid #e5e7eb;
      padding: 20px;
      border-radius: 12px;
      background: white;
      text-align: left;
    }

    .card h2 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .card p {
      font-size: 14px;
      color: #4b5563;
      line-height: 1.6;
      margin-bottom: 6px;
    }

    footer {
      margin-top: 60px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>LOONOOL · Demo 项目主页</h1>
    <p class="desc">这是你的静态项目首页，可以从这里进入报告模板页面。</p>

    <!-- 跳转按钮 -->
    <a class="button" href="report.pdf.html" target="_blank">
      ➜ 打开 PDF 报告页面（report.pdf.html）
    </a>

    <!-- 可选：预览信息卡片 -->
    <div class="card">
      <h2>当前项目文件</h2>
      <p>- index.html（当前页面）</p>
      <p>- report.pdf.html（报告模板页面）</p>
      <p>- main.js / styles.css（如有使用）</p>
      <p>- 将来你可以在这里继续添加 Task 页面、报告入口等。</p>
    </div>

    <footer>
      LOONOOL © 2025 · 仅用于 Demo 展示
    </footer>
  </div>
</body>
</html>
